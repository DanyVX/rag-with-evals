name: controlled-experiments

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        strategy: [fixed, recursive, sentence, structure]
        size: [128, 256, 512, 1024]
        model:
          - id: bge
            name: BAAI/bge-small-en-v1.5
          - id: minilm
            name: sentence-transformers/all-MiniLM-L6-v2
    env:
      PYTHONHASHSEED: "17"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Require human-verified dataset
        run: test -f eval/datasets/human_verified.jsonl

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download pinned corpus
        run: python scripts/download_corpus.py

      - name: Build canonical document store
        run: |
          ragx ingest data/raw/python-3.11.17-docs-html \
            --output data/processed/base_chunks.jsonl \
            --strategy fixed \
            --size 256 \
            --overlap 32 \
            --tokenizer-model BAAI/bge-small-en-v1.5

      - name: Run experiment shard
        run: |
          python scripts/run_retrieval_experiments.py \
            data/processed/base_chunks.documents.jsonl \
            eval/datasets/human_verified.jsonl \
            --strategy "${{ matrix.strategy }}" \
            --size "${{ matrix.size }}" \
            --embedding-model "${{ matrix.model.name }}" \
            --results-dir results/experiments/runs \
            --summary-dir results/experiments/shard-summary

      - name: Upload raw shard results
        uses: actions/upload-artifact@v4
        with:
          name: experiment-shard-${{ matrix.strategy }}-${{ matrix.size }}-${{ matrix.model.id }}
          retention-days: 90
          if-no-files-found: error
          path: results/experiments/runs/*.json

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Sync current main before publishing
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Download all experiment shards
        uses: actions/download-artifact@v4
        with:
          pattern: experiment-shard-*
          path: results/experiments/runs
          merge-multiple: true

      - name: Verify and summarize complete grid
        run: |
          python scripts/summarize_experiments.py \
            --runs results/experiments/runs \
            --output results/experiments

      - name: Commit compact experiment evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            results/experiments/experiment_summary.json \
            results/experiments/compact_results.jsonl \
            results/experiments/EXPERIMENT_SUMMARY.md \
            results/experiments/chunk_heatmap.png \
            results/experiments/pareto_quality_latency.png
          git commit -m "eval: publish complete controlled experiment grid"
          git push origin HEAD:main

      - name: Upload merged experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: ragx-controlled-experiments
          retention-days: 90
          if-no-files-found: error
          path: |
            results/experiments/experiment_summary.json
            results/experiments/compact_results.jsonl
            results/experiments/EXPERIMENT_SUMMARY.md
            results/experiments/chunk_heatmap.png
            results/experiments/pareto_quality_latency.png
