[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rag-with-evals"
version = "0.1.0"
description = "A modular RAG system with rigorous evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "faiss-cpu>=1.8",
  "httpx>=0.27",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pymupdf>=1.24",
  "rank-bm25>=0.2.2",
  "scipy>=1.14",
  "sentence-transformers>=3.0",
  "trafilatura>=1.12",
  "transformers>=4.45",
  "typer>=0.12",
  "uvicorn>=0.30"
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6"
]

[project.scripts]
ragx = "ragx.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ragx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
